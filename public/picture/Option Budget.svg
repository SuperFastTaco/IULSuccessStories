<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2614" height="1318" viewBox="0 0 2614 1318" role="img" aria-labelledby="title description">
  <title id="title">The option budget buys the upside</title>
  <desc id="description">A fifty-dollar IUL option budget buys a packaged call spread that captures S&amp;P 500 index gains from zero percent up to a twelve percent crediting cap.</desc>

  <defs>
    <pattern id="grid" width="154" height="154" patternUnits="userSpaceOnUse">
      <path d="M154 0H0V154" fill="none" stroke="#E8ECE9" stroke-width="1.5"/>
    </pattern>

    <radialGradient id="canvasGlow" cx="80%" cy="63%" r="72%">
      <stop offset="0" stop-color="#F3F7F0" stop-opacity="0.88"/>
      <stop offset="0.62" stop-color="#FAFCF9" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="budgetCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3B3A"/>
      <stop offset="1" stop-color="#303130"/>
    </linearGradient>

    <linearGradient id="payoffFill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#82AD65" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#82AD65" stop-opacity="0.25"/>
    </linearGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="155%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#263126" flood-opacity="0.10"/>
    </filter>

    <filter id="darkShadow" x="-20%" y="-20%" width="140%" height="155%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#222422" flood-opacity="0.17"/>
    </filter>

    <filter id="tagShadow" x="-25%" y="-40%" width="150%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#334033" flood-opacity="0.07"/>
    </filter>

    <style>
      .sans { font-family: "Avenir Next", Arial, "Helvetica Neue", Helvetica, sans-serif; }
      .heavy { font-weight: 800; }
      .bold { font-weight: 700; }
      .medium { font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="2614" height="1318" fill="#FDFEFD"/>
  <rect width="2614" height="1318" fill="url(#canvasGlow)"/>
  <rect width="2614" height="1318" fill="url(#grid)" opacity="0.72"/>
  <circle cx="-135" cy="1515" r="650" fill="none" stroke="#E5E8E5" stroke-width="4" opacity="0.75"/>
  <circle cx="2505" cy="-135" r="610" fill="none" stroke="#DCE6D7" stroke-width="4" opacity="0.72"/>

  <!-- Headline -->
  <g id="headline" class="sans">
    <text x="88" y="126" font-size="82" class="heavy" fill="#303130" letter-spacing="-2">The option budget buys the upside</text>
    <text x="91" y="178" font-size="31" class="medium" fill="#6C7180">A packaged call spread converts a small option budget into capped index-linked growth.</text>
  </g>

  <!-- Left: option budget card -->
  <g id="option-budget-card" filter="url(#darkShadow)">
    <rect x="82" y="242" width="674" height="846" rx="70" fill="url(#budgetCard)"/>
  </g>

  <g id="option-budget-content" class="sans">
    <rect x="143" y="308" width="330" height="91" rx="45.5" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="183" cy="353.5" r="13.5" fill="#8DA0BB"/>
    <text x="216" y="371" font-size="42" class="heavy" fill="#FFFFFF">Option budget</text>

    <text x="137" y="579" font-size="171" class="heavy" fill="#FFFFFF" letter-spacing="-7">$50</text>
    <text x="143" y="664" font-size="48" class="heavy" fill="#FFFFFF">Buys a packaged</text>
    <text x="143" y="724" font-size="48" class="heavy" fill="#FFFFFF">call spread</text>

    <g id="buy-call-chip">
      <rect x="143" y="790" width="514" height="92" rx="30" fill="#EDF2E9"/>
      <circle cx="184" cy="836" r="12" fill="#82AD65"/>
      <text x="215" y="829" font-size="31" class="heavy" fill="#47733D">BUY 0% CALL</text>
      <text x="215" y="860" font-size="25" class="medium" fill="#47733D">captures index gains</text>
    </g>

    <g id="sell-call-chip">
      <rect x="143" y="906" width="514" height="92" rx="30" fill="#F1F2F4"/>
      <circle cx="184" cy="952" r="12" fill="#60708A"/>
      <text x="215" y="945" font-size="31" class="heavy" fill="#536078">SELL 12% CALL</text>
      <text x="215" y="976" font-size="25" class="medium" fill="#536078">helps fund the package</text>
    </g>

    <text x="143" y="1044" font-size="27" font-weight="400" fill="#D4D7DC">Together, the two options fit the $50 budget.</text>
  </g>

  <!-- Connector: budget to payoff -->
  <g id="budget-connector">
    <path d="M758 642 L902 642" fill="none" stroke="#626D80" stroke-width="20" stroke-linecap="round"/>
    <path d="M870 610 L925 642 L870 674 Z" fill="#626D80"/>
    <g filter="url(#tagShadow)">
      <rect x="786" y="565" width="118" height="58" rx="21" fill="#FFFFFF" stroke="#626D80" stroke-width="2"/>
      <text x="845" y="606" text-anchor="middle" class="sans heavy" font-size="27" fill="#536078">$50</text>
    </g>
  </g>

  <!-- Center: capped payoff chart -->
  <g id="payoff-card" filter="url(#cardShadow)">
    <rect x="918" y="225" width="1050" height="862" rx="70" fill="#FFFFFF" stroke="#E4E8E5" stroke-width="2"/>
  </g>

  <g id="payoff-content" class="sans">
    <text x="1005" y="320" font-size="37" class="heavy" fill="#6C7180">S&amp;P 500 INDEX STRATEGY</text>
    <text x="1002" y="390" font-size="64" class="heavy" fill="#303130">How the call spread pays</text>

    <!-- Chart guides -->
    <line x1="1042" y1="890" x2="1868" y2="890" stroke="#D9DCDE" stroke-width="5"/>
    <line x1="1042" y1="474" x2="1042" y2="890" stroke="#D9DCDE" stroke-width="5"/>
    <line x1="1042" y1="566" x2="1868" y2="566" stroke="#303130" stroke-width="5" stroke-dasharray="24 20" opacity="0.92"/>

    <!-- Payoff area and capped line -->
    <path d="M1042 890 L1586 566 L1868 566 L1868 890 Z" fill="url(#payoffFill)"/>
    <path d="M1042 890 L1586 566 L1868 566" fill="none" stroke="#82AD65" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1042" cy="890" r="13" fill="#82AD65"/>
    <circle cx="1586" cy="566" r="13" fill="#82AD65"/>

    <!-- Call annotations -->
    <g id="zero-call-label">
      <rect x="1071" y="757" width="236" height="72" rx="25" fill="#FFFFFF" stroke="#82AD65" stroke-width="2.5"/>
      <text x="1189" y="804" text-anchor="middle" font-size="29" class="heavy" fill="#47733D">BUY AT 0%</text>
    </g>
    <g id="cap-call-label">
      <rect x="1434" y="474" width="302" height="72" rx="25" fill="#FFFFFF" stroke="#536078" stroke-width="2.5"/>
      <text x="1585" y="521" text-anchor="middle" font-size="29" class="heavy" fill="#536078">SELL AT 12%</text>
    </g>

    <!-- Axis labels -->
    <text x="1042" y="949" text-anchor="middle" font-size="29" class="bold" fill="#6C7180">0%</text>
    <text x="1314" y="949" text-anchor="middle" font-size="29" class="bold" fill="#6C7180">6%</text>
    <text x="1586" y="949" text-anchor="middle" font-size="29" class="bold" fill="#47733D">12%</text>
    <text x="1868" y="949" text-anchor="middle" font-size="29" class="bold" fill="#6C7180">18%</text>
    <text x="1455" y="1013" text-anchor="middle" font-size="31" class="medium" fill="#6C7180">S&amp;P 500 index gain</text>

    <text x="1018" y="576" text-anchor="end" font-size="29" class="heavy" fill="#47733D">12%</text>
    <text x="1018" y="900" text-anchor="end" font-size="29" class="heavy" fill="#6C7180">0%</text>
    <text x="1093" y="453" font-size="27" class="medium" fill="#6C7180">Policy credit</text>
  </g>

  <!-- Connector: payoff to result -->
  <g id="result-connector">
    <path d="M1970 642 L2054 642" fill="none" stroke="#82AD65" stroke-width="20" stroke-linecap="round"/>
    <path d="M2022 610 L2077 642 L2022 674 Z" fill="#82AD65"/>
  </g>

  <!-- Right: result card -->
  <g id="result-card" filter="url(#cardShadow)">
    <rect x="2074" y="365" width="455" height="572" rx="64" fill="#FFFFFF" stroke="#E4E8E5" stroke-width="2"/>
  </g>

  <g id="result-content" class="sans">
    <text x="2141" y="451" font-size="34" class="heavy" fill="#6C7180">CREDITING CAP</text>
    <text x="2135" y="614" font-size="144" class="heavy" fill="#82AD65" letter-spacing="-6">12%</text>
    <text x="2141" y="683" font-size="39" class="heavy" fill="#303130">maximum index</text>
    <text x="2141" y="732" font-size="39" class="heavy" fill="#303130">credit</text>

    <line x1="2141" y1="784" x2="2462" y2="784" stroke="#E5E8E5" stroke-width="3"/>
    <rect x="2141" y="821" width="125" height="68" rx="24" fill="#F1F2F4"/>
    <text x="2203.5" y="867" text-anchor="middle" font-size="32" class="heavy" fill="#536078">0%</text>
    <text x="2290" y="849" font-size="27" class="bold" fill="#536078">floor in a</text>
    <text x="2290" y="881" font-size="27" class="bold" fill="#536078">down market</text>
  </g>

  <!-- Footnote -->
  <text x="1307" y="1248" text-anchor="middle" class="sans medium" font-size="27" fill="#7A7F8A">Illustrative example — cap rates vary by policy and market conditions.</text>
</svg>
